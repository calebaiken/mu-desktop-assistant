name: Windows verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build, test and smoke
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify.ps1
      - name: Adversarial architecture controls
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-negative.ps1
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
